<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-label="Profile placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1014"/>
      <stop offset="1" stop-color="#0f1a22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f2ff"/>
      <stop offset="1" stop-color="#0077ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.5">
      <stop offset="0" stop-color="#00f2ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00f2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="600" rx="24" fill="url(#bg)"/>
  <rect width="480" height="600" rx="24" fill="url(#glow)"/>
  <!-- soft grid dots -->
  <g fill="#ffffff" opacity="0.04">
    <circle cx="80" cy="90" r="2.5"/><circle cx="160" cy="120" r="2.5"/><circle cx="400" cy="80" r="2.5"/>
    <circle cx="420" cy="180" r="2.5"/><circle cx="60" cy="220" r="2.5"/><circle cx="360" cy="520" r="2.5"/>
    <circle cx="120" cy="500" r="2.5"/><circle cx="430" cy="430" r="2.5"/>
  </g>
  <!-- avatar silhouette -->
  <g transform="translate(240 250)">
    <circle r="200" fill="#ffffff" opacity="0.02"/>
    <circle cy="-30" r="78" fill="url(#accent)" opacity="0.9"/>
    <path d="M -132 180 C -132 60 -70 22 0 22 C 70 22 132 60 132 180 Z" fill="url(#accent)" opacity="0.9"/>
  </g>
  <rect x="1" y="1" width="478" height="598" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
</svg>
